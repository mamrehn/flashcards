name: Minify and Deploy
run-name: Minify JS/CSS/HTML and deploy to gh-pages

on:
    push:
        branches:
            - 'main'
    workflow_dispatch:

jobs:
    # Nothing reaches gh-pages unless lint, unit and end-to-end tests pass.
    test:
        uses: ./.github/workflows/test.yml
        permissions:
            contents: read

    checkout-minify-push:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Install minification and inlining tools
              run: |
                  npm install -g terser csso-cli html-minifier inline-source-cli
                  npm install --no-save jszip

            - name: Build deck library manifest
              run: node scripts/build-library-manifest.js

            - name: Inject WebSocket URL from secrets
              env:
                  WS_URL: ${{ secrets.WS_URL }}
              run: |
                  if [ -z "$WS_URL" ]; then
                    echo "WS_URL is empty or not set!"
                    exit 1
                  fi
                  echo "WS_URL is set (length: ${#WS_URL})"
                  # The placeholder lives once, in ws-client.js (shared by the
                  # quiz and the poll client).
                  sed -i "s|'__WS_URL__'|'$WS_URL'|g" ws-client.js
                  if grep -q "__WS_URL__" ws-client.js; then
                    echo "WS_URL injection may have failed"
                    exit 1
                  fi
                  echo "WS_URL injected successfully"

            - name: Minify JavaScript files
              run: |
                  terser index.js --compress --mangle -o index.js
                  terser cards.js --compress --mangle -o cards.js
                  terser quiz.js --compress --mangle -o quiz.js
                  terser poll.js --compress --mangle -o poll.js
                  terser library.js --compress --mangle -o library.js
                  terser sanitize.js --compress --mangle -o sanitize.js
                  terser logger.js --compress --mangle -o logger.js
                  terser theme.js --compress --mangle -o theme.js
                  terser ws-client.js --compress --mangle -o ws-client.js
                  terser ui-dialog.js --compress --mangle -o ui-dialog.js

            - name: Minify CSS files
              run: |
                  csso cards.css -o cards.css
                  csso quiz.css -o quiz.css
                  csso poll.css -o poll.css
                  csso library.css -o library.css
                  csso theme.css -o theme.css

            - name: Add inline attributes to HTML files for inlining
              run: |
                  # index.html
                  sed -i 's|<link rel="stylesheet" href="theme\.css" />|<link inline rel="stylesheet" href="theme.css" />|g' index.html
                  sed -i 's|<script src="theme\.js"></script>|<script inline src="theme.js"></script>|g' index.html
                  sed -i 's|<script src="logger\.js"></script>|<script inline src="logger.js"></script>|g' index.html
                  sed -i 's|<script src="index\.js"></script>|<script inline src="index.js"></script>|g' index.html

                  # cards.html
                  sed -i 's|<link rel="stylesheet" href="theme\.css" />|<link inline rel="stylesheet" href="theme.css" />|g' cards.html
                  sed -i 's|<script src="theme\.js"></script>|<script inline src="theme.js"></script>|g' cards.html
                  sed -i 's|<script src="logger\.js"></script>|<script inline src="logger.js"></script>|g' cards.html
                  sed -i 's|<link rel="stylesheet" href="cards\.css" />|<link inline rel="stylesheet" href="cards.css" />|g' cards.html
                  sed -i 's|<script src="sanitize\.js"></script>|<script inline src="sanitize.js"></script>|g' cards.html
                  sed -i 's|<script src="ui-dialog\.js"></script>|<script inline src="ui-dialog.js"></script>|g' cards.html
                  # cards.js / library.js carry `defer` in the source HTML (so they run
                  # after the deferred vendor scripts); inlined at the end of <body>
                  # they still run before DOMContentLoaded, which is all they need.
                  sed -i 's|<script defer src="cards\.js"></script>|<script inline src="cards.js"></script>|g' cards.html

                  # library.html
                  sed -i 's|<link rel="stylesheet" href="theme\.css" />|<link inline rel="stylesheet" href="theme.css" />|g' library.html
                  sed -i 's|<script src="theme\.js"></script>|<script inline src="theme.js"></script>|g' library.html
                  sed -i 's|<script src="logger\.js"></script>|<script inline src="logger.js"></script>|g' library.html
                  sed -i 's|<link rel="stylesheet" href="library\.css" />|<link inline rel="stylesheet" href="library.css" />|g' library.html
                  sed -i 's|<script src="sanitize\.js"></script>|<script inline src="sanitize.js"></script>|g' library.html
                  sed -i 's|<script defer src="library\.js"></script>|<script inline src="library.js"></script>|g' library.html

                  # quiz.html (vendor/ scripts stay separate files)
                  sed -i 's|<link rel="stylesheet" href="theme\.css" />|<link inline rel="stylesheet" href="theme.css" />|g' quiz.html
                  sed -i 's|<script src="theme\.js"></script>|<script inline src="theme.js"></script>|g' quiz.html
                  sed -i 's|<script src="logger\.js"></script>|<script inline src="logger.js"></script>|g' quiz.html
                  sed -i 's|<link rel="stylesheet" href="quiz\.css" />|<link inline rel="stylesheet" href="quiz.css" />|g' quiz.html
                  sed -i 's|<script src="sanitize\.js"></script>|<script inline src="sanitize.js"></script>|g' quiz.html
                  sed -i 's|<script src="ui-dialog\.js"></script>|<script inline src="ui-dialog.js"></script>|g' quiz.html
                  sed -i 's|<script src="ws-client\.js"></script>|<script inline src="ws-client.js"></script>|g' quiz.html
                  sed -i 's|<script src="quiz\.js"></script>|<script inline src="quiz.js"></script>|g' quiz.html

                  # poll.html - mirrors quiz.html
                  sed -i 's|<link rel="stylesheet" href="theme\.css" />|<link inline rel="stylesheet" href="theme.css" />|g' poll.html
                  sed -i 's|<script src="theme\.js"></script>|<script inline src="theme.js"></script>|g' poll.html
                  sed -i 's|<script src="logger\.js"></script>|<script inline src="logger.js"></script>|g' poll.html
                  sed -i 's|<script src="sanitize\.js"></script>|<script inline src="sanitize.js"></script>|g' poll.html
                  sed -i 's|<script src="ui-dialog\.js"></script>|<script inline src="ui-dialog.js"></script>|g' poll.html
                  sed -i 's|<script src="ws-client\.js"></script>|<script inline src="ws-client.js"></script>|g' poll.html
                  sed -i 's|<link rel="stylesheet" href="poll\.css" />|<link inline rel="stylesheet" href="poll.css" />|g' poll.html
                  sed -i 's|<script src="poll\.js"></script>|<script inline src="poll.js"></script>|g' poll.html

                  # datenschutz.html
                  sed -i 's|<link rel="stylesheet" href="theme\.css" />|<link inline rel="stylesheet" href="theme.css" />|g' datenschutz.html
                  sed -i 's|<script src="theme\.js"></script>|<script inline src="theme.js"></script>|g' datenschutz.html
                  sed -i 's|<link rel="stylesheet" href="quiz\.css" />|<link inline rel="stylesheet" href="quiz.css" />|g' datenschutz.html

            - name: Inline CSS and JS into HTML files
              run: |
                  # Inline index.html
                  inline-source index.html --compress false --root ./ > index.inline.html
                  mv index.inline.html index.html

                  # Inline cards.html
                  inline-source cards.html --compress false --root ./ > cards.inline.html
                  mv cards.inline.html cards.html

                  # Inline library.html
                  inline-source library.html --compress false --root ./ > library.inline.html
                  mv library.inline.html library.html

                  # Inline quiz.html
                  inline-source quiz.html --compress false --root ./ > quiz.inline.html
                  mv quiz.inline.html quiz.html

                  # Inline poll.html
                  inline-source poll.html --compress false --root ./ > poll.inline.html
                  mv poll.inline.html poll.html

                  # Inline datenschutz.html
                  inline-source datenschutz.html --compress false --root ./ > datenschutz.inline.html
                  mv datenschutz.inline.html datenschutz.html

            - name: Verify every first-party script and stylesheet was inlined
              run: |
                  # A sed pattern that silently stops matching (e.g. after adding
                  # `defer` to a tag) used to ship unminified, separately fetched
                  # files without anyone noticing. Fail the deploy instead.
                  if grep -nE '<(script[^>]*src|link[^>]*href)="(index|cards|quiz|poll|library|sanitize|logger|theme|ws-client|ui-dialog)\.(js|css)"' *.html; then
                    echo "::error::The files above were not inlined — update the sed patterns."
                    exit 1
                  fi

            - name: Minify inlined HTML files
              run: |
                  html-minifier \
                    --collapse-boolean-attributes \
                    --collapse-whitespace \
                    --minify-css true \
                    --minify-js true \
                    --remove-comments \
                    --remove-redundant-attributes \
                    --remove-script-type-attributes \
                    --remove-style-link-type-attributes \
                    --use-short-doctype \
                    index.html -o index.html

                  html-minifier \
                    --collapse-boolean-attributes \
                    --collapse-whitespace \
                    --minify-css true \
                    --minify-js true \
                    --remove-comments \
                    --remove-redundant-attributes \
                    --remove-script-type-attributes \
                    --remove-style-link-type-attributes \
                    --use-short-doctype \
                    cards.html -o cards.html

                  html-minifier \
                    --collapse-boolean-attributes \
                    --collapse-whitespace \
                    --minify-css true \
                    --minify-js true \
                    --remove-comments \
                    --remove-redundant-attributes \
                    --remove-script-type-attributes \
                    --remove-style-link-type-attributes \
                    --use-short-doctype \
                    library.html -o library.html

                  html-minifier \
                    --collapse-boolean-attributes \
                    --collapse-whitespace \
                    --minify-css true \
                    --minify-js true \
                    --remove-comments \
                    --remove-redundant-attributes \
                    --remove-script-type-attributes \
                    --remove-style-link-type-attributes \
                    --use-short-doctype \
                    quiz.html -o quiz.html

                  html-minifier \
                    --collapse-boolean-attributes \
                    --collapse-whitespace \
                    --minify-css true \
                    --minify-js true \
                    --remove-comments \
                    --remove-redundant-attributes \
                    --remove-script-type-attributes \
                    --remove-style-link-type-attributes \
                    --use-short-doctype \
                    poll.html -o poll.html

                  html-minifier \
                    --collapse-boolean-attributes \
                    --collapse-whitespace \
                    --minify-css true \
                    --remove-comments \
                    --remove-redundant-attributes \
                    --use-short-doctype \
                    datenschutz.html -o datenschutz.html

            - name: Configure Git
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Commit minified and inlined files
              run: |
                  git add *.html decks/library.json
                  git diff --quiet && git diff --staged --quiet || git commit -m "Minify and inline for deployment (SHA: ${{ github.sha }})"

            - name: Deploy to gh-pages
              run: |
                  git push --force origin HEAD:gh-pages || echo "No changes to push"
                  echo "🚀 Successfully deployed to gh-pages branch"
