name: Deploy Quiz Server
run-name: Deploy WebSocket server to Fly.io

on:
    push:
        branches:
            - 'main'
        paths:
            - 'server/**'
    workflow_dispatch:

jobs:
    # The relay is shared by every classroom: never deploy a server that fails
    # the protocol, rate-limit or end-to-end tests.
    test:
        uses: ./.github/workflows/test.yml
        permissions:
            contents: read

    deploy:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Fly CLI
              uses: superfly/flyctl-actions/setup-flyctl@master

            - name: Deploy to Fly.io
              run: flyctl deploy --remote-only
              working-directory: server
              env:
                  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
