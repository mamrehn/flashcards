name: Tests
run-name: Lint, unit and end-to-end tests

# Every commit is tested: pushes to feature branches and pull requests run this
# workflow directly; pushes to main run it through the deploy workflows
# (minify.yml, deploy-server.yml), which only deploy when it passes.
on:
    push:
        branches-ignore:
            - 'main'
            - 'gh-pages'
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    unit:
        name: Lint and unit tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      server/package-lock.json

            - name: Install dependencies
              run: |
                  npm ci
                  npm ci --prefix server --omit=dev

            - name: Lint
              run: npm run lint

            - name: Unit and server tests
              run: npm test

    e2e:
        name: End-to-end tests (Chromium)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      server/package-lock.json

            - name: Install dependencies
              run: |
                  npm ci
                  npm ci --prefix server --omit=dev

            # The browser download is keyed on the lockfile, i.e. on the
            # Playwright version that expects a specific browser build.
            - name: Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Chromium
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Chromium system dependencies
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: End-to-end tests
              run: npm run test:e2e

            - name: Upload report and traces
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 14
